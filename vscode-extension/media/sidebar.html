<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{nonce}}'; style-src {{cspSource}}; img-src {{cspSource}}; connect-src 'none'; font-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{style}}">
  <title>Session History</title>
</head>
<body data-vscode-context='{"preventDefaultContextMenuItems":true}'>
  <section id="search-panel" class="search-controls" aria-label="Search sessions" hidden>
    <div class="search-heading"><span>Search sessions</span><button id="search-close" class="icon-button" type="button" title="Close search and clear results" aria-label="Close search">×</button></div>
    <div id="search-harness" class="harness-filters" role="group" aria-label="Filter by harness">
      <button type="button" data-harness="" title="All harnesses" aria-label="All harnesses" aria-pressed="true"><svg class="filter-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="2" y="2" width="4" height="4" rx=".5"></rect><rect x="10" y="2" width="4" height="4" rx=".5"></rect><rect x="2" y="10" width="4" height="4" rx=".5"></rect><rect x="10" y="10" width="4" height="4" rx=".5"></rect></svg></button>
      <button type="button" data-harness="pi" title="Pi" aria-label="Filter sessions: Pi" aria-pressed="false"><img class="filter-icon icon-light" src="harness/light/pi.svg" alt=""><img class="filter-icon icon-dark" src="harness/dark/pi.svg" alt=""></button>
      <button type="button" data-harness="claude-code" title="Claude Code" aria-label="Filter sessions: Claude Code" aria-pressed="false"><img class="filter-icon icon-light" src="harness/light/claude-code.svg" alt=""><img class="filter-icon icon-dark" src="harness/dark/claude-code.svg" alt=""></button>
      <button type="button" data-harness="codex" title="Codex" aria-label="Filter sessions: Codex" aria-pressed="false"><img class="filter-icon icon-light" src="harness/light/codex.svg" alt=""><img class="filter-icon icon-dark" src="harness/dark/codex.svg" alt=""></button>
      <button type="button" data-harness="opencode" title="OpenCode" aria-label="Filter sessions: OpenCode" aria-pressed="false"><img class="filter-icon icon-light" src="harness/light/opencode.svg" alt=""><img class="filter-icon icon-dark" src="harness/dark/opencode.svg" alt=""></button>
      <button type="button" data-harness="crush" title="Crush" aria-label="Filter sessions: Crush" aria-pressed="false"><img class="filter-icon icon-light" src="harness/light/crush.svg" alt=""><img class="filter-icon icon-dark" src="harness/dark/crush.svg" alt=""></button>
      <button type="button" data-harness="jcode" title="JCode" aria-label="Filter sessions: JCode" aria-pressed="false"><img class="filter-icon icon-light" src="harness/light/jcode.svg" alt=""><img class="filter-icon icon-dark" src="harness/dark/jcode.svg" alt=""></button>
    </div>
    <div class="search-field">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="6.7" cy="6.7" r="4.2"></circle><path d="m9.9 9.9 3.6 3.6"></path></svg>
      <label class="sr-only" for="search">Search sessions</label>
      <input id="search" type="search" maxlength="2000" placeholder="Search user prompts…" autocomplete="off" aria-describedby="search-summary">
    </div>
    <div class="scope-field"><label for="search-scope">Search in</label><select id="search-scope">
      <option value="user">User prompts</option>
      <option value="conversation">User + assistant</option>
      <option value="all">All content, including tools</option>
    </select></div>
    <p id="search-summary" role="status" aria-live="polite">Search local excerpts, not full transcripts.</p>
  </section>
  <p id="status" role="status" aria-live="polite">Loading sessions…</p>
  <main id="groups" aria-label="Sessions by project"></main>
  <script nonce="{{nonce}}" src="{{script}}"></script>
</body>
</html>
